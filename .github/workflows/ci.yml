name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # No committed wrapper yet: use a pinned Gradle. Switch to ./gradlew once `gradle wrapper` output is committed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests (domain, network, app)
        run: gradle test
      - name: Lint and debug build
        run: gradle :app:lintDebug :app:assembleDebug
